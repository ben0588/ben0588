<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Tech Stack</title>
<desc id="d">Interactive tech stack pills categorized by domain</desc>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#b713ff" stop-opacity=".75"/>
<stop offset=".45" stop-color="#30363d"/>
<stop offset="1" stop-color="#30363d"/>
</linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#b713ff" stop-opacity="0.2"/>
<stop offset="100%" stop-color="#d68bff" stop-opacity="0.05"/>
</linearGradient>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#c9d1d9;white-space:pre}
.h{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;fill:#f0f6fc}
.a{fill:#b713ff;font-weight:700}
.m{fill:#8b949e}
.sub{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8b949e}
.cat-title{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;font-weight:600;letter-spacing:.08em;fill:#d68bff}
.pill-bg{fill:#161b22;stroke:#30363d;stroke-width:1;transition:all .2s ease}
.pill-txt{font-size:13px;font-weight:500;fill:#f0f6fc}
.pill{opacity:0;animation:pill-in .5s cubic-bezier(.2,.7,.2,1) forwards}
.pill:hover .pill-bg{fill:url(#glow);stroke:#b713ff;stroke-width:1.5;filter:drop-shadow(0 0 6px #b713ff88)}
.pill:hover .pill-txt{fill:#ffffff}
@keyframes pill-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pill{animation:none;opacity:1}}
</style>
<rect x=".5" y=".5" width="759" height="325" rx="10" fill="#0d1117" stroke="url(#edge)"/>
<text class="h" x="24" y="38"><tspan class="a">$</tspan> tree <tspan class="m">--depth=1</tspan> stack/</text>
<text class="sub" x="736" y="38" text-anchor="end">skills &amp; ecosystem</text>
<g>
<text class="cat-title" x="24" y="74">FRONTEND</text>
<g class="pill" style="animation-delay:0.1s">
<rect x="24" y="90" width="69" height="34" rx="8" class="pill-bg"/>
<circle cx="38" cy="107" r="3" fill="#b713ff"/>
<text class="pill-txt" x="48" y="111">React</text>
</g>
<g class="pill" style="animation-delay:0.15s">
<rect x="103" y="90" width="85" height="34" rx="8" class="pill-bg"/>
<circle cx="117" cy="107" r="3" fill="#b713ff"/>
<text class="pill-txt" x="127" y="111">Next.js</text>
</g>
<g class="pill" style="animation-delay:0.2s">
<rect x="198" y="90" width="110" height="34" rx="8" class="pill-bg"/>
<circle cx="212" cy="107" r="3" fill="#b713ff"/>
<text class="pill-txt" x="222" y="111">JavaScript</text>
</g>
<g class="pill" style="animation-delay:0.25s">
<rect x="318" y="90" width="110" height="34" rx="8" class="pill-bg"/>
<circle cx="332" cy="107" r="3" fill="#b713ff"/>
<text class="pill-txt" x="342" y="111">TypeScript</text>
</g>
<g class="pill" style="animation-delay:0.3s">
<rect x="438" y="90" width="126" height="34" rx="8" class="pill-bg"/>
<circle cx="452" cy="107" r="3" fill="#b713ff"/>
<text class="pill-txt" x="462" y="111">Tailwind CSS</text>
</g>
</g>
<g>
<text class="cat-title" x="24" y="160">BACKEND</text>
<g class="pill" style="animation-delay:0.35s">
<rect x="24" y="176" width="85" height="34" rx="8" class="pill-bg"/>
<circle cx="38" cy="193" r="3" fill="#b713ff"/>
<text class="pill-txt" x="48" y="197">Node.js</text>
</g>
<g class="pill" style="animation-delay:0.4s">
<rect x="119" y="176" width="110" height="34" rx="8" class="pill-bg"/>
<circle cx="133" cy="193" r="3" fill="#b713ff"/>
<text class="pill-txt" x="143" y="197">Express.js</text>
</g>
<g class="pill" style="animation-delay:0.45s">
<rect x="239" y="176" width="85" height="34" rx="8" class="pill-bg"/>
<circle cx="253" cy="193" r="3" fill="#b713ff"/>
<text class="pill-txt" x="263" y="197">Laravel</text>
</g>
</g>
<g>
<text class="cat-title" x="24" y="246">TOOLING &amp; DEPLOY</text>
<g class="pill" style="animation-delay:0.5s">
<rect x="24" y="262" width="61" height="34" rx="8" class="pill-bg"/>
<circle cx="38" cy="279" r="3" fill="#b713ff"/>
<text class="pill-txt" x="48" y="283">Vite</text>
</g>
<g class="pill" style="animation-delay:0.55s">
<rect x="95" y="262" width="53" height="34" rx="8" class="pill-bg"/>
<circle cx="109" cy="279" r="3" fill="#b713ff"/>
<text class="pill-txt" x="119" y="283">Git</text>
</g>
<g class="pill" style="animation-delay:0.6s">
<rect x="158" y="262" width="77" height="34" rx="8" class="pill-bg"/>
<circle cx="172" cy="279" r="3" fill="#b713ff"/>
<text class="pill-txt" x="182" y="283">Vercel</text>
</g>
</g>
</svg>
